; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:fm-devkit]
platform = espressif32
board = fm-devkit
framework = arduino
monitor_speed = 115200
; TLS support (TinyGSM + SSLClient) pushed the firmware past the default
; "min_spiffs" OTA-dual-app partition table (1.3MB per app). This device
; does not use OTA, so switch to "no_ota" (single ~3MB app partition, no
; second OTA slot) to get the flash headroom needed.
board_build.partitions = no_ota.csv
build_flags = 
    -std=gnu++17
    -I include
    -D TINY_GSM_MODEM_SIM800
    -D TINY_GSM_RX_BUFFER=1024
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7
    vshymanskyy/TinyGSM@^0.11.7
    digitaldragon/SSLClient@^1.3.2
